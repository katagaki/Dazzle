<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    A bento layout on the screen: one tall tile, a wide one beside it, and
    two small ones beneath that, as a slide of content blocks would be laid
    out. The tiles are solid and step through shades of white, so the grid
    reads as a design rather than a pattern and holds up in dark mode, where
    see-through tiles would fade into the screen behind them.
  -->
  <rect x="232" y="296" width="248" height="328" rx="22" fill="#FFFFFF"/>
  <rect x="500" y="296" width="292" height="152" rx="22" fill="#DCDCDC"/>
  <rect x="500" y="468" width="136" height="156" rx="22" fill="#C4C4C4"/>
  <rect x="656" y="468" width="136" height="156" rx="22" fill="#EDEDED"/>
</svg>
